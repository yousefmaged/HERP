<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المفكرة الذكية — Scribe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1e1e2e;
            color: #f0f0f8;
            font-family: 'Cairo', system-ui, sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        textarea {
            width: 100%;
            min-height: 400px;
            background: #2a2a3a;
            border: 1px solid #44445a;
            border-radius: 16px;
            padding: 16px;
            color: #f0f0f8;
            font-family: inherit;
            font-size: 16px;
            resize: vertical;
        }
        button {
            background: #e94560;
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 16px;
        }
        .status {
            font-size: 12px;
            color: #8888aa;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>📝 المفكرة الذكية</h2>
        <p style="margin-bottom: 16px; color: #8888aa;">دوّن أفكارك — كل شيء يُحفظ محلياً ومشفّر</p>
        <textarea id="note-content" placeholder="اكتب ملاحظاتك هنا..."></textarea>
        <button id="save-btn">💾 حفظ</button>
        <div class="status" id="save-status"></div>
    </div>

    <script>
        // التواصل مع النواة عبر postMessage
        let kernelPort = null;
        
        // استقبال قناة الاتصال من النواة
        window.addEventListener('message', (event) => {
            if (event.data.type === 'HERP_INIT') {
                kernelPort = event.ports[0];
                kernelPort.onmessage = (e) => {
                    console.log('[Scribe] أمر من النواة:', e.data);
                };
                kernelPort.postMessage({ type: 'READY', module: 'scribe' });
                loadNote();
            }
        });
        
        // تحميل المحتوى المحفوظ
        async function loadNote() {
            try {
                const result = await kernelPort?.postMessage({ type: 'LOAD_NOTE' });
                // في الإصدار الحقيقي، kernelPort سيدعم response
                const saved = localStorage.getItem('scribe_note');
                if (saved) {
                    document.getElementById('note-content').value = saved;
                }
            } catch(e) { console.error(e); }
        }
        
        // حفظ المحتوى
        document.getElementById('save-btn').addEventListener('click', () => {
            const content = document.getElementById('note-content').value;
            localStorage.setItem('scribe_note', content);
            const statusDiv = document.getElementById('save-status');
            statusDiv.textContent = '✓ تم الحفظ محلياً';
            setTimeout(() => { statusDiv.textContent = ''; }, 2000);
            
            // إرسال حدث إلى النواة
            if (kernelPort) {
                kernelPort.postMessage({
                    type: 'NOTE_SAVED',
                    payload: { length: content.length, timestamp: Date.now() }
                });
            }
        });
    </script>
</body>
</html>
