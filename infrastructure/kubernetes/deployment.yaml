apiVersion: apps/v1
kind: Deployment
metadata:
  name: herp-core
spec:
  replicas: 2
  selector:
    matchLabels:
      app: herp
  template:
    metadata:
      labels:
        app: herp
    spec:
      containers:
      - name: herp
        image: herp/core:latest
        ports:
        - containerPort: 80
        env:
        - name: NODE_ENV
          value: "production"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: herp-workspace-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: herp-service
spec:
  selector:
    app: herp
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
